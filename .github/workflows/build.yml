name: Build Symbian app

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit compatibility libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 unzip p7zip-full

      - name: Download toolchain and gnupoc
        run: |
          wget -q https://www.martin.st/symbian/gnupoc-package-1.22.tar.gz
          wget -q https://www.martin.st/symbian/gnu-csl-arm-2005Q1C-arm-none-symbianelf-i686-pc-linux-gnu.tar.bz2
          tar -zxf gnupoc-package-1.22.tar.gz
          mkdir -p csl-gcc
          tar -jxf gnu-csl-arm-2005Q1C-arm-none-symbianelf-i686-pc-linux-gnu.tar.bz2 -C csl-gcc


      - name: Install EKA2 tools
        run: |
          mkdir -p $GITHUB_WORKSPACE/compat-bin
          printf '#!/bin/bash\nexec /usr/bin/g++ -fpermissive "$@"\n' > $GITHUB_WORKSPACE/compat-bin/g++
          chmod +x $GITHUB_WORKSPACE/compat-bin/g++
          export PATH=$GITHUB_WORKSPACE/compat-bin:$PATH
          sed -i 's/(foundPath > 0)/(foundPath != 0)/' gnupoc-package-1.22/tools/bmconv-1.1.0-2/src/pbmcomp.cpp
                    mkdir -p gnupoc-package-1.22/tools/makesis-4/src
          printf 'all:\n\t@true\n' > gnupoc-package-1.22/tools/makesis-4/Makefile
          for f in makesis signsis makekeys; do
            printf '#!/bin/sh\necho "STUB: $f not built yet (OpenSSL 3 incompatibility, to fix later)"\nexit 1\n' > gnupoc-package-1.22/tools/makesis-4/src/$f
            chmod +x gnupoc-package-1.22/tools/makesis-4/src/$f
          done
          cd gnupoc-package-1.22/tools
          ./install_eka2_tools $GITHUB_WORKSPACE/csl-gcc

      - name: Download S60 3rd Edition SDK
        run: |
          wget -q https://archive.org/download/S603rdSDKV1.0/S60_3rd_SDK_v1.0.zip

      - name: Install SDK
        run: |
          cd gnupoc-package-1.22/sdks
          ./install_gnupoc_s60_30 $GITHUB_WORKSPACE/S60_3rd_SDK_v1.0.zip $GITHUB_WORKSPACE/symbian-sdk

      - name: Build hello world
        run: |
          export PATH=$GITHUB_WORKSPACE/csl-gcc/bin:$PATH
          export EPOCROOT=$GITHUB_WORKSPACE/symbian-sdk/
          cd $GITHUB_WORKSPACE/group
          cp -r $GITHUB_WORKSPACE/group $EPOCROOT/myapp_group
          cp -r $GITHUB_WORKSPACE/src $EPOCROOT/myapp_src
          cd $EPOCROOT/myapp_group
          bldmake bldfiles
          abld build gcce urel

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: symbian-build
          path: |
            symbian-sdk/epoc32/release/**
          if-no-files-found: warn
